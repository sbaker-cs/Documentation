<!-- Generate a nice TOC -->
<!-- Controlled by AsciiDoc attributes: dynamic-toc=true, conum-fix=true -->
<script src="https://code.jquery.com/jquery-1.11.3.min.js"></script>
<script src="https://code.jquery.com/ui/1.11.4/jquery-ui.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.tocify/1.9.0/javascripts/jquery.tocify.min.js"></script>
<!-- We do not need the tocify CSS because the asciidoc CSS already provides most of what we neeed -->

<script>
    (function () {
        var savedTheme = localStorage.getItem('theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
    })();
</script>

<style>
    .tocify-header {
        font-style: italic;
    }

    .tocify-subheader {
        font-style: normal;
        font-size: 90%;
    }

    .tocify ul {
        margin: 0;
    }

    .tocify-focus {
        color: #7a2518;
        background-color: rgba(0, 0, 0, 0.1);
    }

    .tocify-focus>a {
        color: #7a2518;
    }

    #theme-toggle {
        position: fixed;
        bottom: 1.5rem;
        right: 1.5rem;
        z-index: 9999;
        width: 2.5rem;
        height: 2.5rem;
        border-radius: 50%;
        border: 1px solid #555;
        background: #2a2a2d;
        color: #ddd;
        font-size: 1.1rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 6px rgba(0,0,0,.4);
        transition: background 0.2s, color 0.2s;
    }

    html[data-theme="light"] #theme-toggle {
        background: #f0f0f0;
        color: #333;
        border-color: #bbb;
        box-shadow: 0 2px 6px rgba(0,0,0,.15);
    }
</style>

<script type="text/javascript">
    $(function () {
        var colorSchemeQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

        // Inject toggle button
        $('body').append('<button id="theme-toggle" title="Toggle light/dark theme"></button>');

        function applyTheme(theme, persist) {
            document.documentElement.setAttribute('data-theme', theme);
            $('#theme-toggle').text(theme === 'dark' ? '☀️' : '🌙');
            if (persist) {
                localStorage.setItem('theme', theme);
            }
        }

        applyTheme(document.documentElement.getAttribute('data-theme'), false);

        $('#theme-toggle').on('click', function () {
            var currentTheme = document.documentElement.getAttribute('data-theme');
            applyTheme(currentTheme === 'dark' ? 'light' : 'dark', true);
        });

        if (colorSchemeQuery) {
            var handleSystemThemeChange = function (event) {
                var savedTheme = localStorage.getItem('theme');
                if (savedTheme === 'dark' || savedTheme === 'light') {
                    return;
                }

                applyTheme(event.matches ? 'dark' : 'light', false);
            };

            if (typeof colorSchemeQuery.addEventListener === 'function') {
                colorSchemeQuery.addEventListener('change', handleSystemThemeChange);
            }
            else if (typeof colorSchemeQuery.addListener === 'function') {
                colorSchemeQuery.addListener(handleSystemThemeChange);
            }
        }

        if ('{dynamic-toc}' === '') {
            // Add a new container for the tocify toc into the existing toc so we can re-use its
            // styling
            $("#toc").append("<div id='generated-toc'></div>");
            $("#generated-toc").tocify({
                extendPage: true,
                context: "#content",
                highlightOnScroll: true,
                hideEffect: "slideUp",
                // Use the IDs that asciidoc already provides so that TOC links and intra-document
                // links are the same. Anything else might confuse users when they create bookmarks.
                hashGenerator: function (text, element) {
                    return $(element).attr("id");
                },
                // Smooth scrolling doesn't work properly if we use the asciidoc IDs
                smoothScroll: false,
                // Set to 'none' to use the tocify classes
                theme: "none",
                // Handle book (may contain h1) and article (only h2 deeper)
                selectors: $("#content").has("h1").size() > 0 ? "h1,h2,h3,h4,h5" : "h2,h3,h4,h5",
                ignoreSelector: ".discrete"
            });

            // Switch between static asciidoc toc and dynamic tocify toc based on browser size
            // This is set to match the media selectors in the asciidoc CSS
            // Without this, we keep the dynamic toc even if it is moved from the side to preamble
            // position which will cause odd scrolling behavior
            var handleTocOnResize = function () {
                if ($(document).width() < 768) {
                    $("#generated-toc").hide();
                    $(".sectlevel0").show();
                    $(".sectlevel1").show();
                }
                else {
                    $("#generated-toc").show();
                    $(".sectlevel0").hide();
                    $(".sectlevel1").hide();
                }
            }

            $(window).resize(handleTocOnResize);
            handleTocOnResize();
        }

        if ('{conum-fix}' === '') {
            // Replace b.conum (fallback format) with a proper i.conum[data-value] element
            // so the existing circular badge CSS applies correctly.
            document.querySelectorAll("b.conum").forEach(function (el) {
                var match = el.textContent.match(/\((\d+)\)/);
                if (match) {
                    var conum = document.createElement("i");
                    conum.className = "conum";
                    conum.setAttribute("data-value", match[1]);
                    el.parentNode.replaceChild(conum, el);
                }
            });
        }
    });
</script>
